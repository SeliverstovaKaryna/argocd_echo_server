apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: echo-server
  namespace: "argocd2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: echo-server
  source:
    path: HelmCharts/Chart1/echo-server
    repoURL: git@github.com:SeliverstovaKaryna/argocd_echo_server.git
    targetRevision: HEAD
  destination:
    name: in-cluster
    namespace: hello
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
